configuration:
  email:
    name: eufy email
    description: The email of the eufy account the bridge logs in with.
  password:
    name: eufy password
    description: The password for that eufy account. Stored by the Supervisor, sent only to the bridge.
  country:
    name: Country code
    description: Two-letter account country (e.g. GB, US, DE) — routes the correct eufy region.
  live_recording_cleanup:
    name: Delete old recorded live views
    description: >-
      Off by default: recorded live views (/media/eufy) are kept for ever. Switched on, the bridge deletes
      recordings older than the number of days below.
  live_recording_keep_days:
    name: Keep recorded live views for (days)
    description: >-
      Used only when deleting old recorded live views is on. 90 by default.
  local_addresses:
    name: Cameras on the local network
    description: >-
      Cameras the bridge connects to directly on your LAN - serial number and IP address. Use it for a
      camera blocked from the internet: the cloud then reports it offline, but pan/tilt, the speaker and
      settings work through the local connection.
  solix_email:
    name: Solix email (optional)
    description: Anker Solix account email. Fill this AND the Solix password to add the Solarbank / smart-meter entities. Leave empty to keep Solix off. A separate account from eufy.
  solix_password:
    name: Solix password (optional)
    description: Password for the Anker Solix account. Stored by the Supervisor, sent only to the bridge.
  solix_country:
    name: Solix country code (optional)
    description: Two-letter Solix account country (e.g. GB, DE). Leave empty to reuse the eufy country above.
